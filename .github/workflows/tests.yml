name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # No Meraki credentials are needed: the tests stub the SDK client or
      # inspect it without making API calls.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify the SDK cache as the container user
        run: |
          docker build -t meraki-mcp-test .
          docker run --rm -i --network none --entrypoint python \
            -e MERAKI_API_KEY=offline-test -e MCP_TRANSPORT=stdio \
            meraki-mcp-test - < tests/check_container_sdk_cache.py
