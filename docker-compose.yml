services:
  meraki-mcp:
    build: .
    container_name: meraki-magic-mcp
    ports:
      # Published on the host's loopback interface only. To accept connections from
      # other machines, set MCP_PUBLISH_HOST=0.0.0.0 and MCP_AUTH_TOKEN.
      - "${MCP_PUBLISH_HOST:-127.0.0.1}:8000:8000"
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      MCP_SERVER: dynamic
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MERAKI_API_KEY: ${MERAKI_API_KEY:?Set MERAKI_API_KEY in the environment}
      MERAKI_ORG_ID: ${MERAKI_ORG_ID:-}
      MERAKI_BASE_URL: ${MERAKI_BASE_URL:-https://api.meraki.com/api/v1}
      MERAKI_PYTHON_SDK_CALLER: ${MERAKI_PYTHON_SDK_CALLER:-}
      READ_ONLY_MODE: ${READ_ONLY_MODE:-true}
    volumes:
      - meraki-cache:/app/.meraki_cache
    restart: unless-stopped

volumes:
  meraki-cache:
